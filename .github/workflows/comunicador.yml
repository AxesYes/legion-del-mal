# This is a basic workflow to help you get started with Actions

name: comunicador

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      villano:
        description: 'villano a quien se le va a enviar el mensaje'
        required: true
        type: choice
        options:
          - lex luthor
          - brainiac
          - darkseid

jobs:
  enviar-mensaje:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4